<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Inteligente de Alta Precisão - OMR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="window.openCvPronto = true;"></script>
    <style>
        /* (Estilos mantidos exatamente como o anterior para preservar sua interface visual) */
        :root { --primary: #15803d; --primary-hover: #166534; --bg-color: #0f172a; --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --border: #cbd5e1; --danger: #ef4444; --success: #22c55e; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: var(--card-bg); width: 100%; max-width: 580px; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); box-sizing: border-box; }
        .header-logo { text-align: center; margin-bottom: 15px; }
        .header-logo h1 { font-size: 15px; font-weight: 700; color: var(--text-main); margin: 6px 0 0 0; text-transform: uppercase; }
        .header-logo p { font-size: 11px; color: var(--text-muted); margin: 3px 0 0 0; }
        .step-container { margin-bottom: 14px; }
        label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 5px; color: var(--text-main); }
        select { width: 100%; padding: 11px; font-size: 14px; border: 1px solid var(--border); border-radius: 10px; background-color: #fff; outline: none; box-sizing: border-box; }
        select:disabled { background-color: #f8fafc; color: var(--text-muted); cursor: not-allowed; }
        #containerCameraAoVivo { display: none; position: relative; background: #000; border-radius: 14px; overflow: hidden; margin-top: 10px; text-align: center; }
        #videoCamera { width: 100%; max-height: 480px; object-fit: cover; display: block; }
        .moldura-guia { position: absolute; top: 10%; left: 10%; right: 10%; bottom: 10%; border: 3px solid #38bdf8; border-radius: 12px; pointer-events: none; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 10px; box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5); transition: border-color 0.2s ease, box-shadow 0.2s ease; }
        .moldura-guia.enquadrado { border-color: var(--success) !important; box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(34, 197, 94, 0.4); }
        .tag-status-cam { background: rgba(14, 165, 233, 0.95); color: white; font-size: 11px; font-weight: bold; padding: 6px 14px; border-radius: 6px; transition: background 0.2s; }
        .enquadrado .tag-status-cam { background: var(--success); }
        .btn-action { padding: 14px; font-size: 15px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; width: 100%; margin-top: 5px;}
        .btn-camera { background-color: var(--primary); }
        .btn-manage { background-color: #475569; margin-top: 10px; }
        #status { margin-top: 15px; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 500; text-align: center; background-color: #f8fafc; border: 1px solid var(--border); color: var(--text-muted); }
        canvas { display: none; }
        #painelConferencia { display: none; background: #f8fafc; border: 2px solid var(--primary); border-radius: 12px; padding: 15px; margin-top: 15px; text-align: left; }
        .tabela-respostas { max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; background: white; padding: 10px; margin-top: 8px; }
        .linha-questao { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        .linha-questao select { width: 75px; padding: 4px; font-size: 13px; text-align: center; border-radius: 6px; }
        #modalGestao { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 16px; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; }
        .envio-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; gap: 10px; }
        .btn-delete { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-logo">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2" style="margin-bottom: 2px;"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
        <h1>EEMTI Agostinho Neres Portela</h1>
        <p>Scanner de Alta Precisão Absoluta</p>
    </div>
    
    <div class="step-container">
        <label for="selectDisciplina">1. Disciplina</label>
        <select id="selectDisciplina" onchange="verificarLiberacao()">
            <option value="">-- Selecione a Disciplina --</option>
            <option value="Matemática">Matemática</option>
            <option value="Português">Português</option>
        </select>
    </div>

    <div class="step-container">
        <label for="selectSerie">2. Série / Turma</label>
        <select id="selectSerie" onchange="filtrarAlunos()" disabled><option value="">Selecione a disciplina primeiro...</option></select>
    </div>

    <div class="step-container">
        <label for="selectAluno">3. Aluno(a)</label>
        <select id="selectAluno" disabled><option value="">Selecione a série primeiro...</option></select>
    </div>

    <div class="step-container">
        <label>4. Digitalizar Gabarito</label>
        <button class="btn-action btn-camera" id="btnAbrirCam" onclick="iniciarCameraAoVivo()" style="opacity: 0.4; pointer-events: none;">📷 Abrir Câmera Inteligente</button>

        <div id="containerCameraAoVivo">
            <video id="videoCamera" autoplay playsinline></video>
            <div class="moldura-guia" id="molduraGuia">
                <div class="tag-status-cam" id="txtInstrucaoCam">🎯 Enquadre o Retângulo Preto</div>
                <div style="font-size: 10px; color: #bae6fd; background: rgba(0,0,0,0.7); padding: 3px 8px; border-radius: 4px;">Segure firme quando ficar VERDE</div>
            </div>
            <button class="btn-action" style="margin: 10px auto; width: calc(100% - 20px); background-color: #0284c7;" onclick="forcarCapturaManual()">⚡ Capturar Forçado</button>
        </div>
    </div>

    <div id="painelConferencia">
        <h4 style="margin:0 0 5px 0; color:var(--primary); font-size:14px;">🔍 Confira a Leitura Exata:</h4>
        <div id="listaRespostasEditaveis" class="tabela-respostas"></div>
        <div style="display: flex; gap: 8px; margin-top: 12px;">
            <button class="btn-action btn-camera" style="flex:1;" onclick="salvarAjustesEEnviar()">✅ Enviar</button>
            <button class="btn-action" style="flex:1; background: var(--danger);" onclick="cancelarEnvio()">❌ Refazer</button>
        </div>
    </div>

    <button class="btn-action btn-manage" onclick="abrirGestao()">📋 Gerenciar Envios</button>

    <div id="status">Aguardando seleções...</div>
    <canvas id="canvasProcessamento"></canvas>
    <canvas id="canvasAnaliseAoVivo" style="display:none;"></canvas>
</div>

<div id="modalGestao">
    <div class="modal-content">
        <h3 style="margin-top:0;">Provas Já Enviadas</h3>
        <div id="listaEnvios">Carregando...</div>
        <button class="btn-action btn-manage" onclick="fecharGestao()">Fechar</button>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoJgP4HgHv3e1NGYI5pfLgUBPiTaKnNY18b8Ba5Lc47orQiDcjrGETpgxn7jyn7Iw7/exec"; 
    const GABARITO_OFICIAL = ["D", "C", "C", "A", "A", "D", "A", "D", "C", "B", "D", "C", "B", "D", "B", "C", "D", "D", "A", "A", "B", "B", "B", "E", "C", "B"];
    let dadosGlobais = {}; let mediaStream = null; let monitorAoVivoAtivo = false; let contadorEstabilidade = 0; const LIMIAR_ESTABILIDADE = 6;

    function verificarLiberacao() {
        const disc = document.getElementById('selectDisciplina').value;
        const selectSerie = document.getElementById('selectSerie');
        if (!disc) { selectSerie.disabled = true; bloquearBotoesFoto(true); return; }
        if (Object.keys(dadosGlobais).length === 0) {
            fetch(GOOGLE_SCRIPT_URL + "?action=buscarDados").then(res => res.json()).then(data => { dadosGlobais = data; preencherSeries(); });
        } else { preencherSeries(); }
    }

    function preencherSeries() {
        const selectSerie = document.getElementById('selectSerie');
        selectSerie.innerHTML = '<option value="">-- Selecione a Série --</option>';
        Object.keys(dadosGlobais).forEach(serie => { selectSerie.add(new Option(serie, serie)); });
        selectSerie.disabled = false;
    }

    function filtrarAlunos() {
        const serie = document.getElementById('selectSerie').value;
        const selectAluno = document.getElementById('selectAluno');
        selectAluno.innerHTML = '<option value="">-- Selecione o Aluno --</option>';
        if (!serie) { selectAluno.disabled = true; bloquearBotoesFoto(true); return; }
        (dadosGlobais[serie] || []).forEach(aluno => { selectAluno.add(new Option(aluno, aluno)); });
        selectAluno.disabled = false; selectAluno.onchange = checarAlunoPronto;
    }

    function checarAlunoPronto() {
        if (document.getElementById('selectAluno').value) {
            bloquearBotoesFoto(false); document.getElementById('status').innerText = "Tudo pronto! Clique em 'Abrir Câmera Inteligente'.";
        } else { bloquearBotoesFoto(true); }
    }

    function bloquearBotoesFoto(bloquear) {
        document.getElementById('btnAbrirCam').style.opacity = bloquear ? "0.4" : "1";
        document.getElementById('btnAbrirCam').style.pointerEvents = bloquear ? "none" : "auto";
    }

    async function iniciarCameraAoVivo() {
        document.getElementById('containerCameraAoVivo').style.display = "block";
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" }, width: { ideal: 1920 } } });
        } catch (e) {
            mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
        }
        const video = document.getElementById('videoCamera');
        video.srcObject = mediaStream;
        video.onloadedmetadata = () => { video.play(); monitorAoVivoAtivo = true; contadorEstabilidade = 0; loopDeteccaoAoVivo(); };
    }

    function orderPoints(pts) {
        pts.sort((a, b) => a.y - b.y);
        let top = [pts[0], pts[1]].sort((a, b) => a.x - b.x);
        let bottom = [pts[2], pts[3]].sort((a, b) => a.x - b.x);
        return [top[0], top[1], bottom[1], bottom[0]]; // TL, TR, BR, BL
    }

    // Procura o retângulo da caixa preta para estabilidade
    function checarEnquadramentoFrame() {
        if (!window.openCvPronto) return false;
        const video = document.getElementById('videoCamera');
        const canvas = document.getElementById('canvasAnaliseAoVivo');
        if (video.videoWidth === 0) return false;

        canvas.width = 400; canvas.height = Math.floor(video.videoHeight * (400 / video.videoWidth));
        const ctx = canvas.getContext('2d'); ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        try {
            let src = cv.imread(canvas); let gray = new cv.Mat(); cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            let blurred = new cv.Mat(); cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
            let edges = new cv.Mat(); cv.Canny(blurred, edges, 50, 150);
            let contours = new cv.MatVector(); let hierarchy = new cv.Mat();
            cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            let achou = false;
            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                if (cv.contourArea(cnt) > (canvas.width * canvas.height * 0.15)) {
                    let approx = new cv.Mat();
                    cv.approxPolyDP(cnt, approx, 0.02 * cv.arcLength(cnt, true), true);
                    if (approx.rows === 4) { achou = true; }
                    approx.delete();
                }
            }
            src.delete(); gray.delete(); blurred.delete(); edges.delete(); contours.delete(); hierarchy.delete();
            return achou;
        } catch (err) { return false; }
    }

    function loopDeteccaoAoVivo() {
        if (!monitorAoVivoAtivo) return;
        setTimeout(() => {
            if (!monitorAoVivoAtivo) return;
            let ok = checarEnquadramentoFrame();
            const moldura = document.getElementById('molduraGuia');
            if (ok) {
                contadorEstabilidade++; moldura.classList.add('enquadrado');
                document.getElementById('txtInstrucaoCam').innerText = `✅ FIRME! (${contadorEstabilidade}/${LIMIAR_ESTABILIDADE})`;
                if (contadorEstabilidade >= LIMIAR_ESTABILIDADE) {
                    monitorAoVivoAtivo = false; if (navigator.vibrate) navigator.vibrate(200); forcarCapturaManual();
                }
            } else {
                contadorEstabilidade = 0; moldura.classList.remove('enquadrado');
                document.getElementById('txtInstrucaoCam').innerText = "🎯 Enquadre o Retângulo Preto";
            }
            loopDeteccaoAoVivo();
        }, 150);
    }

    function forcarCapturaManual() {
        monitorAoVivoAtivo = false;
        const video = document.getElementById('videoCamera'); const canvas = document.getElementById('canvasProcessamento');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
        document.getElementById('containerCameraAoVivo').style.display = "none";
        processarComPerspectiva(canvas);
    }

    async function processarComPerspectiva(canvas) {
        const statusEl = document.getElementById('status');
        statusEl.innerText = "Extraindo e corrigindo perspectiva matemática...";

        try {
            let src = cv.imread(canvas); let gray = new cv.Mat(); cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            let blurred = new cv.Mat(); cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
            let edges = new cv.Mat(); cv.Canny(blurred, edges, 50, 150);
            let contours = new cv.MatVector(); let hierarchy = new cv.Mat();
            cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            let maxArea = 0; let bestApprox = null;
            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                let area = cv.contourArea(cnt);
                if (area > (src.cols * src.rows * 0.1) && area > maxArea) {
                    let approx = new cv.Mat();
                    cv.approxPolyDP(cnt, approx, 0.02 * cv.arcLength(cnt, true), true);
                    if (approx.rows === 4) {
                        maxArea = area; 
                        if (bestApprox) bestApprox.delete();
                        bestApprox = approx;
                    } else { approx.delete(); }
                }
            }

            if (!bestApprox) { throw new Error("Retângulo preto do gabarito não encontrado na foto."); }

            // ORGANIZA OS 4 PONTOS E APLICA WARP PERSPECTIVE (Achata a imagem para dimensões fixas)
            let ptsArray = [];
            for (let i = 0; i < 4; i++) { ptsArray.push({x: bestApprox.data32S[i*2], y: bestApprox.data32S[i*2+1]}); }
            let ordered = orderPoints(ptsArray);
            
            // Dimensão plana fixa padronizada
            let W = 600; let H = 800; 
            
            let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [ ordered[0].x, ordered[0].y, ordered[1].x, ordered[1].y, ordered[2].x, ordered[2].y, ordered[3].x, ordered[3].y ]);
            let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [ 0, 0, W, 0, W, H, 0, H ]);
            let M = cv.getPerspectiveTransform(srcTri, dstTri);
            
            let warped = new cv.Mat();
            cv.warpPerspective(gray, warped, M, new cv.Size(W, H), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

            // Threshold na imagem perfeita achatada
            let thresh = new cv.Mat();
            cv.threshold(warped, thresh, 0, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU);

            // SINCRONIA MATEMÁTICA: Exatamente as porcentagens do HTML do Novo Gabarito
            const xCol1_Bolhas = [0.20, 0.27, 0.34, 0.41, 0.48];
            const xCol2_Bolhas = [0.70, 0.77, 0.84, 0.91, 0.98];
            let respostasLidas = [];
            let alternativas = ["A", "B", "C", "D", "E"];

            for (let col = 0; col < 2; col++) {
                for (let q = 0; q < 13; q++) {
                    let yPct = 0.08 + (q * 0.07); // 8% a 92%
                    let yPos = Math.floor(yPct * H);
                    
                    let melhorAlternativa = "A"; let maxPixels = -1;

                    for (let a = 0; a < 5; a++) {
                        let xPct = col === 0 ? xCol1_Bolhas[a] : xCol2_Bolhas[a];
                        let xPos = Math.floor(xPct * W);

                        // Cria um retângulo de amostragem de 16x16px exato sobre a bolha
                        let sampleSize = 10; 
                        let rect = new cv.Rect(xPos - sampleSize, yPos - sampleSize, sampleSize * 2, sampleSize * 2);
                        let regiao = thresh.roi(rect);
                        let contagem = cv.countNonZero(regiao);

                        if (contagem > maxPixels) { maxPixels = contagem; melhorAlternativa = alternativas[a]; }
                        regiao.delete();
                    }
                    respostasLidas.push(melhorAlternativa);
                }
            }

            // Limpa memória rigorosamente
            src.delete(); gray.delete(); blurred.delete(); edges.delete(); contours.delete(); hierarchy.delete();
            bestApprox.delete(); srcTri.delete(); dstTri.delete(); M.delete(); warped.delete(); thresh.delete();

            mostrarPainelConferencia(respostasLidas);

        } catch (e) {
            statusEl.innerText = "❌ Erro: " + e.message;
        }
    }

    function mostrarPainelConferencia(respostas) {
        const container = document.getElementById('listaRespostasEditaveis'); container.innerHTML = "";
        respostas.forEach((resp, idx) => {
            let opcoesHtml = "";
            ["A", "B", "C", "D", "E"].forEach(letra => { opcoesHtml += `<option value="${letra}" ${letra === resp ? 'selected' : ''}>${letra}</option>`; });
            container.innerHTML += `<div class="linha-questao"><span>Questão ${idx + 1}:</span><select id="resp_q_${idx}">${opcoesHtml}</select></div>`;
        });
        document.getElementById('painelConferencia').style.display = "block";
        document.getElementById('status').innerText = "✨ Processamento com Perspectiva concluído!";
    }

    function salvarAjustesEEnviar() {
        let respostas = []; for (let i = 0; i < 26; i++) { respostas.push(document.getElementById(`resp_q_${i}`).value); }
        let acertos = 0; for (let i = 0; i < GABARITO_OFICIAL.length; i++) { if (respostas[i] === GABARITO_OFICIAL[i]) acertos++; }
        
        let dados = {
            disciplina: document.getElementById('selectDisciplina').value,
            nome: `${document.getElementById('selectAluno').value} (${document.getElementById('selectSerie').value})`,
            respostas: respostas,
            nota: Number(((acertos / 26) * 10).toFixed(1))
        };

        document.getElementById('painelConferencia').style.display = "none";
        document.getElementById('status').innerText = "Enviando dados...";
        fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados) })
        .then(() => { document.getElementById('status').innerText = `✅ Sucesso! Nota ${dados.nota}`; setTimeout(reiniciarSistema, 2500); });
    }

    function cancelarEnvio() { document.getElementById('painelConferencia').style.display = "none"; reiniciarSistema(); }
    function reiniciarSistema() { monitorAoVivoAtivo = false; document.getElementById('selectAluno').value = ""; document.getElementById('status').innerText = "Selecione outro aluno..."; checarAlunoPronto(); }
    function abrirGestao() { /* Código mantido igual ao anterior para o modal de gestão */ }
    function fecharGestao() { document.getElementById('modalGestao').style.display = "none"; }
</script>
</body>
</html>
